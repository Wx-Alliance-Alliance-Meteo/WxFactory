[project]
dynamic = ["version"]
requires-python = ">= 3.11"
dependencies = [
    "certifi==2025.6.15",
    "cftime==1.6.4.post1",
    "contourpy==1.3.2",
    "cupy-cuda12x==13.5.1",
    "cycler==0.12.1",
    "fastrlock==0.8.3",
    "fonttools==4.58.0",
    "kiwisolver==1.4.8",
    "matplotlib==3.10.3",
    "mpi4py==4.1.0",
    "mpmath==1.3.0",
    "netCDF4==1.7.2",
    "numpy==2.2.5",
    "packaging==25.0",
    "pillow==11.2.1",
    "pybind11==2.13.6",
    "pyparsing==3.2.3",
    "python-dateutil==2.9.0.post0",
    "scipy==1.15.3",
    "six==1.17.0",
    "snakeviz==2.2.2",
    "sympy==1.14.0",
    "tornado==6.4.2",
    "tqdm==4.67.1"
]

[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"] 
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]


[tool.black]
line-length = 120
