[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wxfactory"
dynamic = ["version"]
description = "A numerical weather prediction research framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mpi4py",
    "numpy",
    "scipy>=1.15",
    "torch",
    "sympy",
    "packaging",
    "netcdf4",
    "matplotlib",
    "xarray",
    "dask",
    "zarr>=3,<4",
    "numcodecs",
    "scikit-image",
]

[project.scripts]
wxfactory = "wx_factory.main:main"

[tool.setuptools]
# Kept under [tool.setuptools] (rather than [project], which is PEP 639 and needs setuptools >= 77)
# so that older setuptools accept it.
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["wx_factory*"]

[tool.setuptools.package-data]
"wx_factory.common" = ["config-format.json"]

[tool.setuptools_scm]
write_to = "wx_factory/_version.py"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
