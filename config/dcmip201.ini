# Reduced-planet rest-state diagnostic using the DCMIP Fortran constant-lapse-rate profile.
# This variant does not reproduce the official DCMIP 2-0-1 setup.
[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0
ztop = 12000.0
vertical_coord = sleve
sleve_scale_large = 10000.0
sleve_scale_small = 2500.0

[Test_case]
equations = euler
depth_approx = shallow
case_number = 201

[Time_integration]
t_end = 1800
dt = 10
time_integrator = epi2
exponential_solver = pmex
krylov_mmax = 32
tolerance = 1e-6

[Spatial_discretization]
num_solpts = 5
num_elements_horizontal = 18
num_elements_vertical = 3

[Output_options]
stat_freq = 0
output_freq = 10
base_output_file = dcmip201

[Device]
precision = double
pytorch_device = cuda
