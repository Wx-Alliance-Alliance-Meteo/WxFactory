# Translating isentropic Euler vortex without gravity.
[Grid]
grid_type = cartesian3d
lateral_boundary = periodic
vertical_boundary = periodic

x0 = -10
x1 = 10
y0 = 0
y1 = 1
z0 = 0
z1 = 20

[Test_case]
equations = euler
case_number = 555

[Time_integration]
dt = 0.2
t_end = 20
time_integrator = epi_stiff3
exponential_solver = pmex
krylov_size = 10
tolerance = 1e-10
starting_step = 0
verbose_solver = 0
gmres_restart = 30

[Spatial_discretization]
num_solpts = 3
num_elements_horizontal = 20
num_elements_vertical   = 20

[Output_options]
stat_freq = 1
output_freq = 1
save_state_freq = 1
output_dir = results/euler_vortex

[Device]
precision = double
pytorch_device = cuda
