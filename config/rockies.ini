[Device]

pytorch_device = cuda

[Grid]

grid_file = exp_cs.fst


[Test_case]

equations = shallow_water
topography_file = exp_cs.fst
initial_conditions = exp_cs.fst


[Time_integration]

dt = 180
t_end = 18000
time_integrator = ros2
exponential_solver = kiops

tolerance = 1e-7
gmres_restart = 20
starting_step = 0



[Output_options]

stat_freq = 0

output_freq = 1

save_state_freq = 0


output_dir  = results

