# DCMIP-2012 test 2-1: nonhydrostatic mountain waves without wind shear.

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0

ztop = 30000.0

# SLEVE makes the terrain ripple decay faster with height than the broad envelope.
vertical_coord = sleve
sleve_scale_large = 10000.0
sleve_scale_small = 2500.0

[Test_case]
equations = euler
depth_approx = shallow
case_number = 21

[Time_integration]
t_end = 7200
dt = 10
time_integrator = epi2
exponential_solver = exode
exode_method = M4(3)
tolerance = 1.0e-5

[Spatial_discretization]
num_solpts = 3
num_elements_horizontal = 20
num_elements_vertical = 20

[Output_options]
stat_freq = 0
output_freq = 100 / 10
base_output_file = dcmip21_epi2

[Post_processing]
enable_schar_mountain = 1
schar_mountain_longitude = pi / 4
schar_mountain_lattitude = 0
schar_mountain_height = 250
schar_mountain_radius = 5000
schar_mountain_length = 4000
schar_mountain_step = 0

[Device]
precision = mixed
pytorch_device = cuda
