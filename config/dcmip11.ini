# DCMIP-2012 test 1-1: 3D deformational flow (pure tracer advection).
[Grid]
grid_type = cubed_sphere

# Pure tracer advection: freeze the dynamics, integrate only the passive tracers.
advection_only = on
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0

ztop = 12000.0

[Test_case]

# A step hook restores the prescribed meteorological state after each step.
equations = euler
depth_approx = shallow
case_number = 11

[Time_integration]

# 12 days
t_end = 1036800

dt = 900

time_integrator = epi2

# Avoid the memory cost of a complex-valued right-hand side.
jacobian_method = fd
# PMEX requires a tolerance above its float32 accuracy floor.
tolerance = 1.2e-5
krylov_mmax = 10

[Spatial_discretization]

num_solpts = 5

# 90 points per panel edge: 1 degree at the equator.
num_elements_horizontal = 18

# 60 vertical points: 200 m mean spacing.
num_elements_vertical = 12

[Output_options]

stat_freq = 0

# Daily output.
output_freq = 86400 / 900

base_output_file = dcmip11

[Device]

# Mixed precision reduces runtime storage while retaining selected double-precision operations.
precision = mixed

# Run PyTorch operations on the GPU.
pytorch_device = cuda
