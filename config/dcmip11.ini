# DCMIP-2012 test 1-1: 3D deformational flow (pure tracer advection).
[Grid]
grid_type = cubed_sphere

lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0

ztop = 12000.0

[Test_case]
equations = euler
depth_approx = shallow
case_number = 11

advection_only = on

[Time_integration]
t_end = 1036800
dt = 900
time_integrator = epi2

# Allow for rounding in the float32 Krylov basis.
tolerance = 1.2e-5
krylov_mmax = 10

[Spatial_discretization]
jacobian = analytic
num_solpts = 5
num_elements_horizontal = 18
num_elements_vertical = 12

[Output_options]
stat_freq = 0
output_freq = 86400 / 900
base_output_file = dcmip11

[Device]
precision = mixed
pytorch_device = cuda
