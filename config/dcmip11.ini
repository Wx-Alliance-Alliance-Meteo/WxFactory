# DCMIP-2012 test 1-1: 3D deformational flow (pure tracer advection).
#
[General]
# The whole computation is in single precision, which halves the memory footprint and is what lets
# 1 deg / L60 fit on a single GPU. It is also the precision GEM uses on this class of hardware.
precision = single

# The full Euler system is integrated; the state carries the four DCMIP tracers after the five
# meteorological variables. A step hook restores the prescribed meteorological state after each
# step, which is what makes this a pure advection test.
equations = euler

# DCMIP recommends the shallow-atmosphere setup when a model provides both.
depth_approx = shallow

[Grid]
grid_type = cubed_sphere

# Pure tracer advection (DCMIP 1-x): freeze the dynamics, integrate only the passive tracers.
advection_only = on
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0

ztop = 12000.0

[Test_case]

case_number = 11

[Time_integration]

# 12 days
t_end = 1036800

dt = 900

time_integrator = epi2

# Finite-difference Jacobian for the exponential integrator. The complex-step alternative runs the
# whole right-hand side in complex arithmetic, which both doubles the working memory and, in single
# precision, uses a perturbation below the rounding error. Finite differences avoid both problems.
jacobian_method = fd
tolerance = 1e-7
krylov_mmax = 16

[Spatial_discretization]

num_solpts = 3

# 30 * 3 = 90 points per panel edge -> 1 deg at the equator
num_elements_horizontal = 30

# 20 * 3 = 60 vertical levels over 12000 m -> dz = 200 m
num_elements_vertical = 20

[Output_options]

stat_freq = 0

# Daily output: 86400 s / dt (900 s) = 96 steps
output_freq = 96

base_output_file = dcmip11

[System]

# Run the pure-python kernels on the GPU through Pytorch. This backend reproduces the compiled
# CPU/CUDA kernels to round-off, and stays within about 20% of the hand-written CUDA kernels,
# because most of the RHS is operator application (matmuls) rather than pointwise work.
desired_device = torch
pytorch_device = cuda
