[Grid]
grid_type = cartesian3d
# Cartesian cases use a slab invariant in y.
lateral_boundary = wall
y0 = 0
y1 = 1000

x0 = -26000
x1 =  26000
z0 = 0
z1 = 6400

[Test_case]
equations = euler
case_number = 4
bubble_theta = 300.

[Time_integration]
dt = 5
t_end = 900
time_integrator = epi2
exponential_solver=pmex
krylov_size = 10
tolerance = 1e-6

[Spatial_discretization]
num_solpts = 5
num_elements_horizontal = 50
num_elements_vertical   = 10
[Output_options]
stat_freq = 1
output_freq = 1
output_dir = results/straka
