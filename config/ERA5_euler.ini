[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0
ztop = 20000

[Test_case]

equations = euler
advection_only = off

initial_conditions = /fs/site7/eccc/mrd/rpna/cap003/datasets/era5_0.25deg_13level_lq/2020
topography_file = 

[Time_integration]
dt = 18
t_end = 18

time_integrator = epi3
exponential_solver = pmex
tolerance = 1e-7
gmres_restart = 20
starting_step = 0

[Spatial_discretization]
num_solpts = 5
num_elements_horizontal = 12
num_elements_vertical = 4

[Output_options]
stat_freq = 0
output_freq = 1
save_state_freq = 1
store_solver_stats = 0
output_dir  = results
output_format = netcdf
