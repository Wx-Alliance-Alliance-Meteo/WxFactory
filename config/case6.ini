[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.7853981633974483
alpha0 = 0.0

[Test_case]
equations = shallow_water
case_number = 6

[Time_integration]
dt = 1800
t_end = 1209600
time_integrator = epi3
exponential_solver = pmex
tolerance = 1e-7

[Spatial_discretization]
num_solpts = 3
num_elements_horizontal = 10

[Output_options]
stat_freq = 0
output_freq = 1
save_state_freq = 0
store_solver_stats = 0
output_dir  = results
output_format = netcdf
