[Grid]
grid_type = cartesian3d

# Flat 3D slab, the 2D bubble is extruded uniformly
# in y, with solid walls on the lateral boundaries.
lateral_boundary = wall
advection_only = off

x0 = 0
x1 = 1000
y0 = 0
y1 = 1000
z0 = 0
z1 = 1500

[Test_case]

equations = euler

# Possible values
#   1  = constant
#   2  = gaussian
#   3  = cold bubble
case_number = 2

bubble_theta = 303.15
bubble_rad = 250.


[Time_integration]
dt = 5
t_end = 1080
time_integrator = epi2
krylov_size = 10
tolerance = 1e-12
jacobian_method = complex
starting_step = 0
verbose_solver = 0
gmres_restart = 30

[Spatial_discretization]
num_solpts = 5
num_elements_horizontal = 19
num_elements_vertical   = 30

[Output_options]
stat_freq = 1
output_freq = 1
save_state_freq = 0
store_solver_stats = 1
output_dir = results

[Device]
precision = double
pytorch_device = cuda
