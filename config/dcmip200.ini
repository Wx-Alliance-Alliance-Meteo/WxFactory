# DCMIP-2012 test 2-0-0: atmosphere at rest over moderately steep terrain.

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0
ztop = 12000.0
# SLEVE makes the terrain ripple decay faster with height than the broad envelope.
vertical_coord = sleve
sleve_scale_large = 10000.0
sleve_scale_small = 2500.0

[Test_case]
equations = euler
depth_approx = shallow
case_number = 200

[Time_integration]
t_end = 518400
dt = 100
time_integrator = epi2
exponential_solver = pmex
krylov_mmax = 32
tolerance = 1.2e-6

[Spatial_discretization]
num_solpts = 5
num_elements_horizontal = 18
num_elements_vertical = 3

[Output_options]
stat_freq = 0
output_freq = 36
base_output_file = dcmip200

[Device]
precision = mixed
pytorch_device = cuda
