# DCMIP-2012 test 1-2: 3D Hadley-like meridional circulation (pure tracer advection).
#
[General]
# The whole computation is in single precision, which halves the memory footprint and is what lets
# 1 deg / L60 fit on a single GPU. It is also the precision GEM uses on this class of hardware.
precision = single

# The full Euler system is integrated; the state carries the single DCMIP tracer after the five
# meteorological variables. A step hook restores the prescribed meteorological state after each
# step, which is what makes this a pure advection test.
equations = euler

# DCMIP recommends the shallow-atmosphere setup when a model provides both.
depth_approx = shallow

[Grid]
grid_type = cubed_sphere

# Pure tracer advection (DCMIP 1-x): freeze the dynamics, integrate only the passive tracers.
advection_only = on
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0

ztop = 12000.0

[Test_case]

case_number = 12

[Time_integration]

# 1 day: the period of the motion
t_end = 86400

# The document does not prescribe a time step. The strong overturning of this case wants a small
# step; at this resolution 450 s keeps the run close to the spatial error floor of the grid.
dt = 450

time_integrator = epi2

# Finite-difference Jacobian for the exponential integrator. The complex-step alternative runs the
# whole right-hand side in complex arithmetic, which both doubles the working memory and, in single
# precision, uses a perturbation below the rounding error. Finite differences avoid both problems.
jacobian_method = fd
tolerance = 1e-7

# Largest Krylov subspace the exponential solver may build. It holds mmax+1 basis vectors of the
# full state, so capping it keeps the run within memory, at the cost of more substeps.
krylov_mmax = 16

[Spatial_discretization]

num_solpts = 3

# 30 * 3 = 90 points per panel edge -> 1 deg at the equator
num_elements_horizontal = 30

# 20 * 3 = 60 vertical levels over 12000 m -> dz = 200 m
num_elements_vertical = 20

[Output_options]

stat_freq = 0

# Hourly output: 3600 s / dt (450 s) = 8 steps
output_freq = 8

base_output_file = dcmip12

[System]

# Run the pure-python kernels on the GPU through Pytorch. This test gives the same error norms on
# numpy, cupy and torch, and torch reproduces the numpy fields to round-off.
desired_device = torch
pytorch_device = cuda
