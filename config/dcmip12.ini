# DCMIP-2012 test 1-2: 3D Hadley-like meridional circulation (pure tracer advection).
#
[General]
# The full Euler system is integrated; the state carries the single DCMIP tracer after the five
# meteorological variables. A step hook restores the prescribed meteorological state after each
# step, which is what makes this a pure advection test.
equations = euler

# DCMIP recommends the shallow-atmosphere setup when a model provides both.
depth_approx = shallow

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0

ztop = 12000.0

[Test_case]

case_number = 12

[Time_integration]

# 1 day: the period of the motion
t_end = 86400

# The document does not prescribe a time step for this test. Halving it from 1800 s to 900 s cuts
# the l1 error from 0.32 to 0.25, and halving it again only reaches 0.23, so 900 s sits close to the
# spatial error floor of this grid without paying for steps that buy nothing.
dt = 900

time_integrator = epi2
tolerance = 1e-7

# Largest Krylov subspace the exponential solver may build. It holds mmax+1 basis vectors of the
# full state, so capping it keeps the run within memory, at the cost of more substeps.
krylov_mmax = 16

[Spatial_discretization]

num_solpts = 3

# 15 * 3 = 45 points per panel edge -> 2 deg at the equator
num_elements_horizontal = 15

# 10 * 3 = 30 vertical levels over 12000 m -> dz = 400 m
num_elements_vertical = 10

[Output_options]

stat_freq = 0

# Hourly output: 3600 s / dt (900 s) = 4 steps
output_freq = 4

base_output_file = dcmip12

[System]

# Run the pure-python kernels on the GPU through Pytorch. This test gives the same error norms on
# numpy, cupy and torch, and torch reproduces the numpy fields to round-off.
desired_device = torch
pytorch_device = cuda
