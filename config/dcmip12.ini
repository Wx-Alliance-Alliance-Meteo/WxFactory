# DCMIP-2012 test 1-2: 3D Hadley-like meridional circulation (pure tracer advection).
[Grid]
grid_type = cubed_sphere

# Freeze the prescribed flow and integrate only the tracer.
advection_only = on
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0

ztop = 12000.0

[Test_case]

# A step hook restores the prescribed meteorological state after each step.
equations = euler

# Recommended DCMIP configuration.
depth_approx = shallow

case_number = 12

[Time_integration]

# One circulation period.
t_end = 86400

dt = 450

time_integrator = epi2

tolerance = 1.2e-5
krylov_mmax = 10

[Spatial_discretization]

num_solpts = 5

# 90 points per panel edge: 1 degree at the equator.
num_elements_horizontal = 18

# 60 vertical points: 200 m mean spacing.
num_elements_vertical = 12

[Output_options]

stat_freq = 0

# Hourly output.
output_freq = 8

base_output_file = dcmip12

[Device]

# Mixed precision reduces runtime storage while retaining selected double-precision operations.
precision = mixed

# Run PyTorch operations on the GPU.
pytorch_device = cuda
