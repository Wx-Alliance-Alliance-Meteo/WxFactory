[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0

[Test_case]
equations = shallow_water

case_number = 10

[Time_integration]

dt = 1800

t_end = 432000

time_integrator = epi4

tolerance = 1e-7

[Spatial_discretization]

num_solpts = 3

num_elements_horizontal = 10

[Output_options]

stat_freq = 1

output_freq = 1

base_output_file = out
