# DCMIP 2-0-1: atmosphere at rest over a mountain with a 70-degree maximum slope.
#
# This follows the same hydrostatic state and Schar-like mountain shape as
# DCMIP 2-0-0. On the documented X=500 reduced-radius planet, the mountain
# amplitude is chosen so max |grad(z_s)| = tan(70 degrees), giving a peak
# height of approximately 2187.46 m. The exact solution remains at rest.

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0
ztop = 12000.0
vertical_coord = sleve
sleve_scale_large = 10000.0
sleve_scale_small = 2500.0

[Test_case]
equations = euler
depth_approx = shallow
case_number = 201

[Time_integration]
# Six scaled days on the X=500 planet.
t_end = 1036.8
dt = 1.2
time_integrator = partrosexp2
jacobian_method = fd
exponential_solver = pmex
krylov_mmax = 32
tolerance = 1.2e-5

[Spatial_discretization]
num_solpts = 3
# 45 points per panel edge (2 degrees) and 30 vertical levels (400 m).
num_elements_horizontal = 15
num_elements_vertical = 10

[Output_options]
stat_freq = 0
# Six scaled hours: (21600 / 500) s / 1.2 s = 36 steps.
output_freq = 36
base_output_file = dcmip201_rosexp

[Device]
precision = mixed
pytorch_device = cuda
