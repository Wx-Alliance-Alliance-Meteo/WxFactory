# Rest-state diagnostic using the repository's case-201 mountain/profile variant.
# This variant does not reproduce the official DCMIP 2-0-1 setup.

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0
ztop = 12000.0
vertical_coord = sleve
sleve_scale_large = 10000.0
sleve_scale_small = 2500.0

[Test_case]
equations = euler
depth_approx = shallow
case_number = 201

[Time_integration]
# Times are unscaled seconds; the case uses a planet-size reduction of 500.
t_end = 1036.8
dt = 1.2
time_integrator = partrosexp2
exponential_solver = pmex
krylov_mmax = 32
tolerance = 1.2e-5

[Spatial_discretization]
num_solpts = 3
num_elements_horizontal = 15
num_elements_vertical = 10

[Output_options]
stat_freq = 0
# Six scaled hours correspond to 43.2 unscaled seconds.
output_freq = 36
base_output_file = dcmip201_rosexp

[Device]
precision = mixed
pytorch_device = cuda
