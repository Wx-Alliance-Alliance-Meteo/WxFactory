# DCMIP-2012 test 3-1: nonhydrostatic gravity wave at the equator.

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0
ztop = 10000.0

[Test_case]
equations = euler
depth_approx = shallow
case_number = 31

[Time_integration]
t_end = 3600
dt = 1
time_integrator = epi2
exponential_solver = pmex
krylov_mmax = 32
tolerance = 1.2e-5

[Spatial_discretization]
num_solpts = 3
num_elements_horizontal = 26
num_elements_vertical = 4
jacobian = analytic

[Output_options]
stat_freq = 0
output_freq = 100/5
base_output_file = dcmip31

[Device]
precision = mixed
pytorch_device = cuda
