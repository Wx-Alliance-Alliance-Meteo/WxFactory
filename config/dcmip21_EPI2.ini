# DCMIP-2012 test 2-1: non-hydrostatic mountain waves over a Schar-type mountain, non-sheared flow.
#
# Follows the DCMIP-2012 Test Case Document v1.7 (Table XIII and section 2.X / 2.1):
#   - non-rotating reduced-size planet, radius a = a_ref / X with X = 500, so the equatorial
#     circumference is about 80 km and the response spans the hydrostatic/non-hydrostatic range
#   - z_top = 30000 m, a Schar-type mountain (h0 = 250 m, half-width d = 5000 m, wavelength xi =
#     4000 m) centred at (lambda_c, phi_c) = (pi/4, 0)
#   - a hydrostatically balanced isothermal-per-column background (T_eq = 300 K, p_eq = 1000 hPa)
#     with a uniform zonal wind u_eq = 20 m/s (the shear parameter c = 0 for 2-1)
#   - Rayleigh friction in the top third of the domain (z_h = 20000 m, tau0 = 25 s) absorbs the
#     upward-propagating gravity waves so they do not reflect off the model top. This is applied
#     automatically for case_number 21 as a forcing on the momentum equations (see the RHS).
#   - run to t = 7200 s (1000 hr in scaled units), output every 100 s (73 snapshots)

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0

ztop = 30000.0

# Smooth-level vertical coordinate (Schar et al. 2002): the mountain ripple gets a fast decay (s2)
# and the underlying bell a slow one (s1), so the small scales leave the coordinate surfaces well
# below the wave-generation region. The mountain is only 250 m tall, so this stays comfortably
# within the SLEVE invertibility bound.
vertical_coord = sleve
sleve_scale_large = 10000.0
sleve_scale_small = 2500.0

[Test_case]

equations = euler

# DCMIP recommends the shallow-atmosphere setup when a model provides both.
depth_approx = shallow

case_number = 21

[Time_integration]

# 7200 s unscaled == 1000 hr in scaled (X = 500) units.
t_end = 7200

# Exponential propagator integrator (EPI2). Being exponential it is unconditionally stable, so it can
# step well past the explicit acoustic CFL: dt = 1 s is 8x the tvdrk3 step (0.125 s) and stays stable
# in single precision. Two things are required to make single-precision GPU runs robust:
#   - jacobian_method = fd: the complex-step Jacobian mixes complex64/complex128 on the PyTorch
#     backend and crashes; the finite-difference Jacobian (state-scaled step) is used instead.
#   - tolerance >= ~1.2e-5: a float32 Krylov basis cannot resolve a residual below ~100*eps_f32, so
#     PMEX rejects any tighter tolerance rather than growing the Krylov space without bound.
dt = 1

time_integrator = epi2
jacobian_method = fd
exponential_solver = pmex

# PMEX converges in ~20 Krylov iterations at this step, so 32 is ample and keeps the basis footprint
# small (6 ranks share one 8 GB GPU).
krylov_mmax = 32

# Just above the single-precision floor (100 * eps_float32 ~ 1.19e-5). The solver aborts with a
# suggested value if this is set lower.
tolerance = 1.2e-5

[Spatial_discretization]

num_solpts = 3

# 20 * 3 = 60 points per panel edge -> 1.5 deg at the equator (about 333 m on the small planet)
num_elements_horizontal = 20

# 20 * 3 = 60 vertical levels over 30000 m -> dz = 500 m in the flat regions
num_elements_vertical = 20

[Output_options]

stat_freq = 0

# Output every 100 s: 100 s / dt 
output_freq = 100

base_output_file = dcmip21_epi2

[Post_processing]
enable_schar_mountain = 1
schar_mountain_longitude = pi / 4
schar_mountain_lattitude = 0
schar_mountain_height = 250
schar_mountain_radius = 5000
schar_mountain_length = 4000
# 0: apply the full mountain at initialisation (no gradual ramp-up)
schar_mountain_step = 0

[Device]

# Mixed precision stores the state and most runtime arrays in single precision while retaining
# double precision in accuracy-sensitive construction and solver operations. The explicit
# right-hand side is substantially faster in this mode than in double precision on the target GPU.
precision = mixed

# The 3D Euler system is stiff; this case is run on the GPU through PyTorch only.
pytorch_device = cuda
