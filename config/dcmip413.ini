# DCMIP-2012 test 4-1-3: dry baroclinic instability, X = 1000.

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0

ztop = 44000.0

vertical_coord = gal_chen
vertical_stretch = 2.8

[Test_case]
equations = euler
depth_approx = shallow
case_number = 413

[Time_integration]
t_end = 2592
dt = 0.06

time_integrator = epi2
exponential_solver = pmex
krylov_mmax = 64
tolerance = 1.2e-5


[Spatial_discretization]
num_solpts = 5
num_elements_horizontal = 18
num_elements_vertical = 6

jacobian = analytic

# Weak post-step modal filter
expfilter_apply = 1
expfilter_order = 4
expfilter_cutoff = 0.5
expfilter_strength = 0.1


[Output_options]
stat_freq = 0
output_freq = 1440
base_output_file = dcmip413


[Device]
precision = mixed
pytorch_device = cuda
