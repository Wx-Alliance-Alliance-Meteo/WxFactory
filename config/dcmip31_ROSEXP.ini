# DCMIP-2012 test 3-1: non-hydrostatic gravity wave at the equator.
#
# Table XIV and section 3-1: non-rotating X=125 planet, ztop=10 km,
# N=0.01 s-1 balanced atmosphere with u=20 cos(phi) m/s, and a localized
# 1 K potential-temperature perturbation centred at (2 pi/3, 0).

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0
ztop = 10000.0

[Test_case]
equations = euler
depth_approx = shallow
case_number = 31

[Time_integration]
# The document specifies 3600 s in unscaled units (125 scaled hours).
t_end = 3600
dt = 15
time_integrator = partrosexp2
jacobian_method = fd
exponential_solver = pmex
krylov_mmax = 32
tolerance = 1.2e-5

[Spatial_discretization]
# 80 nodal points per panel edge (nominally 1.125 degrees).
num_solpts = 5
num_elements_horizontal = 16
num_elements_vertical = 2
# Weak post-step modal filter
expfilter_apply = 1
expfilter_order = 4
expfilter_cutoff = 0.5
expfilter_strength = 0.1

[Output_options]
stat_freq = 0
# Required 100 s output interval: 100/dt
output_freq = 5
base_output_file = dcmip31_rosexp

[Device]
# Mixed precision stores the state and most runtime arrays in single precision while retaining
# double precision in accuracy-sensitive construction and solver operations.
precision = mixed
pytorch_device = cuda
