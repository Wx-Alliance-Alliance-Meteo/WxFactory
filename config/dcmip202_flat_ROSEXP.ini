# Non-standard DCMIP 2-0-2 flat-surface control.
#
# This uses the atmosphere from section 2.0 (T0 = 300 K, lapse rate 0.0065 K/m,
# ztop = 12 km) on the required non-rotating, regular-size planet, but suppresses
# the mountain. Compare it with dcmip200_ROSEXP.ini to separate the
# pressure-gradient error caused by terrain-following coordinates.

[General]
equations = euler
depth_approx = shallow

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0
ztop = 12000.0

[Test_case]
case_number = 202

[Time_integration]
# Six days
t_end = 518400
dt = 600
time_integrator = partrosexp2
jacobian_method = fd
exponential_solver = pmex
krylov_mmax = 32
tolerance = 1.2e-5

[Spatial_discretization]
num_solpts = 3
# 90 points per panel edge (1 degree) and 15 vertical levels (800 m).
num_elements_horizontal = 30
num_elements_vertical = 10

[Output_options]
stat_freq = 0
# Six-hourly output: 21600 s / 600 s.
output_freq = 36
base_output_file = dcmip202_flat_rosexp

[System]
precision = double
pytorch_device = cuda
