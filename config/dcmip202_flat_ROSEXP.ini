# Flat-surface rest-state control; not an official DCMIP test.
# Compare with dcmip200_ROSEXP.ini to assess the effect of terrain.

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0
ztop = 12000.0

[Test_case]
equations = euler
depth_approx = shallow
case_number = 202

[Time_integration]
t_end = 518400
dt = 600
time_integrator = partrosexp2
exponential_solver = pmex
krylov_mmax = 32
tolerance = 1.2e-5

[Spatial_discretization]
num_solpts = 3
num_elements_horizontal = 30
num_elements_vertical = 10

[Output_options]
stat_freq = 0
output_freq = 36
base_output_file = dcmip202_flat_rosexp

[Device]
precision = double
pytorch_device = cuda
