# DCMIP-2012 test 2-0-0: atmosphere at rest over moderately steep orography.
#
# Section 2.0 / Table XII: non-rotating regular-size planet, ztop = 12 km,
# T0 = 300 K, lapse rate 0.0065 K/m, and the compact Schar-like 2000 m
# mountain centred at (3 pi/2, 0).  The exact solution remains at rest.

[General]
equations = euler
depth_approx = shallow

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0
ztop = 12000.0
# SLEVE separates the broad bell from the oscillatory terrain component so
# the small-scale coordinate deformation decays rapidly with height.
vertical_coord = sleve
sleve_scale_large = 10000.0
sleve_scale_small = 2500.0

[Test_case]
case_number = 200

[Time_integration]
# Six days
t_end = 518400
dt = 600
time_integrator = partrosexp2
jacobian_method = fd
exponential_solver = pmex
krylov_mmax = 32
tolerance = 1.2e-5

[Spatial_discretization]
num_solpts = 3
# 90 points per panel edge (1 degree) and 15 vertical levels (800 m).
num_elements_horizontal = 30
num_elements_vertical = 5

[Output_options]
stat_freq = 0
# Six-hourly output: 21600 s / 600 s.
output_freq = 36
base_output_file = dcmip200_rosexp

[System]
precision = mixed
pytorch_device = cuda
