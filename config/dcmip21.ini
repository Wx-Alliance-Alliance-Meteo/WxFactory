# DCMIP-2012 test 2-1: nonhydrostatic mountain waves without wind shear.

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0

ztop = 30000.0

# SLEVE makes the terrain ripple decay faster with height than the broad envelope.
vertical_coord = sleve
sleve_scale_large = 10000.0
sleve_scale_small = 2500.0

[Test_case]

equations = euler

depth_approx = shallow

case_number = 21

[Time_integration]

t_end = 7200

dt = 2

time_integrator = partrosexp2
exponential_solver = pmex

krylov_mmax = 32

tolerance = 1.2e-5

[Spatial_discretization]

num_solpts = 5

num_elements_horizontal = 12

num_elements_vertical = 12


riemann_solver = acoustic
# Analytic actions avoid the extra float64 RHS used by finite-difference probes.
jacobian = analytic

[Output_options]

stat_freq = 0

output_freq = 100 / 10

base_output_file = dcmip21

[Post_processing]
enable_schar_mountain = 1
schar_mountain_longitude = pi / 4
schar_mountain_lattitude = 0
schar_mountain_height = 250
schar_mountain_radius = 5000
schar_mountain_length = 4000
schar_mountain_step = 0

[Device]

precision = mixed

pytorch_device = cuda
