[Grid]
grid_type = cartesian3d
# Cartesian cases use a slab invariant in y.
lateral_boundary = wall
y0 = 0
y1 = 1000

x0 = 0
x1 = 1000
z0 = 0
z1 = 1000

[Test_case]
equations = euler
case_number = 1
bubble_theta = 303.15
bubble_rad = 250.

[Time_integration]
dt = 5.
t_end = 600
time_integrator = epi2
krylov_size = 10
tolerance = 6e-6

[Spatial_discretization]
num_solpts = 5
num_elements_horizontal = 20
num_elements_vertical   = 20

[Output_options]
stat_freq = 1
output_freq = 1
output_dir = results/pill
