[Grid]
grid_type = cartesian3d
lateral_boundary = wall

x0 = 0
x1 = 1000
y0 = 0
y1 = 1000
z0 = 0
z1 = 1000

[Test_case]
equations = euler
case_number = 3
bubble_theta = 303.15
bubble_rad = 250.

[Time_integration]
dt = 5
t_end = 600
time_integrator = epi2
krylov_size = 10
tolerance = 1e-6

[Spatial_discretization]
riemann_solver = acoustic
num_solpts = 5
num_elements_horizontal = 20
num_elements_vertical = 20
jacobian = analytic

[Output_options]
stat_freq = 1
output_freq = 1
output_dir = results/cold_bubble
