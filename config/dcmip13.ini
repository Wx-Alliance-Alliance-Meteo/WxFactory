# DCMIP-2012 test 1-3: horizontal advection of thin cloud-like tracers over orography.

[Grid]
grid_type = cubed_sphere

# Freeze the prescribed flow and integrate only the tracers.
advection_only = on
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0

ztop = 12000.0

# SLEVE
vertical_coord = sleve
sleve_scale_large = 10000.0
sleve_scale_small = 2500.0

[Test_case]

# The steady wind and mass field remain prescribed.
equations = euler

# Recommended DCMIP configuration.
depth_approx = shallow

case_number = 13

[Time_integration]

# One revolution around the sphere.
t_end = 1036800

dt = 900

time_integrator = epi2

jacobian_method = fd
tolerance = 1.2e-5
krylov_mmax = 10

[Spatial_discretization]

num_solpts = 3

# 90 points per panel edge: 1 degree at the equator.
num_elements_horizontal = 30

# 60 vertical points: 200 m mean spacing over flat terrain.
num_elements_vertical = 20

[Output_options]

stat_freq = 0

# Daily output.
output_freq = 86400 / 900

base_output_file = dcmip13

[Device]

# Mixed precision reduces runtime storage while retaining selected double-precision operations.
precision = mixed

pytorch_device = cuda
