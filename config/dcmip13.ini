# DCMIP-2012 test 1-3: horizontal advection of thin cloud-like tracers over orography.
#
# Follows the DCMIP-2012 Test Case Document v1.7 (Table XI and section 1.3):
#   - unscaled planet (X = 1), isothermal T0 = 300 K, z_top = 12000 m
#   - a Schar-like mountain with compact support (h0 = 2000 m, Rm = 3 pi / 4, zeta_m = pi / 16)
#   - solid body rotation tilted by alpha = pi / 6, carrying three thin cloud decks once around the
#     sphere in 12 days, horizontally with respect to mean sea level
#   - the vertical coordinate follows the terrain, so a wind that is purely horizontal in physical
#     space still crosses the coordinate surfaces. That perceived vertical velocity is what this
#     test exercises; it comes out of the metric on its own
#   - runs at the document's 1 degree with 60 levels, which is the resolution at which the terrain-
#     following coordinate is well enough resolved to keep the clouds coherent over the mountain
#   - daily output of q1..q4 (86400 s), including the initial state (13 snapshots)

[General]
# The whole computation is in single precision, which halves the memory footprint and is what lets
# 1 deg / L60 fit on a single GPU.
precision = single

# The full Euler system is integrated; the state carries the four cloud tracers after the five
# meteorological variables. The wind is prescribed and the mass field is frozen, which is what makes
# this a pure advection test. Unlike tests 1-1 and 1-2, the wind here does not depend on time, so no
# step hook is needed to refresh it.
equations = euler

# DCMIP recommends the shallow-atmosphere setup when a model provides both.
depth_approx = shallow

[Grid]
grid_type = cubed_sphere

# Pure tracer advection (DCMIP 1-x): freeze the dynamics, integrate only the passive tracers.
advection_only = on
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0

ztop = 12000.0

# Smooth-level vertical coordinate (Schar et al. 2002): the ripple of the mountain gets a fast decay
# (s2) and the underlying bell a slow one (s1), so the small scales leave the coordinate surfaces
# well below cloud level. This keeps the clouds far better than Gal-Chen (the linear-decay default),
# but only once the coordinate is well resolved; at coarser resolution its steeper near-surface
# metric terms amplify the aliasing of the oscillatory mountain instead.
vertical_coord = sleve
sleve_scale_large = 10000.0
sleve_scale_small = 2500.0

[Test_case]

case_number = 13

[Time_integration]

# 12 days: the time it takes the flow to carry the clouds once around the sphere
t_end = 1036800

dt = 900

time_integrator = epi2

# Finite-difference Jacobian for the exponential integrator. The complex-step alternative runs the
# whole right-hand side in complex arithmetic, which both doubles the working memory and, in single
# precision, uses a perturbation below the rounding error. Finite differences avoid both problems.
jacobian_method = fd
# Single precision: 1e-7 is below float32 epsilon (~1.2e-7) and unreachable. Use the float32 floor
# (100 * eps), matching the other single-precision configs (dcmip21_EPI2, dcmip21_ROSEXP).
tolerance = 1.2e-5

# Largest Krylov subspace the exponential solver may build. It holds mmax+1 basis vectors of the
# full state, so capping it keeps the run within memory, at the cost of more substeps.
krylov_mmax = 16

[Spatial_discretization]

num_solpts = 3

# 30 * 3 = 90 points per panel edge -> 1 deg at the equator
num_elements_horizontal = 30

# 20 * 3 = 60 vertical levels over 12000 m -> dz = 200 m in the flat regions
num_elements_vertical = 20

[Output_options]

stat_freq = 0

# Daily output: 86400 s / dt (900 s) = 96 steps
output_freq = 96

base_output_file = dcmip13

[System]

pytorch_device = cuda
