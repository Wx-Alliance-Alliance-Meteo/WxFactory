[General]
equations = euler
depth_approx = shallow

[System]
desired_device = cuda

[Test_case]
case_number = 31

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0
ztop = 10000.0

[Time_integration]
dt = 14.5
t_end = 1812.5

time_integrator = epi2
tolerance = 1e-8
exponential_solver = kiops

[Preconditioning]
preconditioner = none

[Spatial_discretization]
num_solpts = 5
num_elements_horizontal = 144
num_elements_vertical = 18

[Output_options]
stat_freq = 0
output_freq = 0
save_state_freq = 25
store_solver_stats = 0

# Adjust output directory as desired. Path (if not absolute) is relative to project root
output_dir = results/benchmark
