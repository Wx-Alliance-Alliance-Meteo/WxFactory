# Small CPU DCMIP 2-1 configuration for distributed autodiff checks.

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0

ztop = 30000.0

vertical_coord = sleve
sleve_scale_large = 10000.0
sleve_scale_small = 2500.0

[Test_case]
equations = euler
depth_approx = shallow
case_number = 21

[Time_integration]

t_end = 7200
dt = 1

time_integrator = tvdrk3
exponential_solver = pmex

krylov_mmax = 32
tolerance = 1.2e-5

[Spatial_discretization]

num_solpts = 3

num_elements_horizontal = 2
num_elements_vertical = 3

[Output_options]

stat_freq = 0

output_freq = 0

base_output_file = dcmip21_rosexp

[Post_processing]
enable_schar_mountain = 1
schar_mountain_longitude = pi / 4
schar_mountain_lattitude = 0
schar_mountain_height = 250
schar_mountain_radius = 5000
schar_mountain_length = 4000
schar_mountain_step = 0

[Device]

precision = double
pytorch_device = cpu
