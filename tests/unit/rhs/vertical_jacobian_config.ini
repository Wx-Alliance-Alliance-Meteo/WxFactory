# Small cartesian3d Euler config for the vertical-Jacobian directional-derivative test.
# Tiny grid, CPU, double precision -- just enough vertical elements to exercise J1.
[Grid]
grid_type = cartesian3d
lateral_boundary = wall
advection_only = off
x0 = 0
x1 = 1000
y0 = 0
y1 = 1000
z0 = 0
z1 = 1500

[Test_case]
equations = euler
case_number = 2
bubble_theta = 303.15
bubble_rad = 250.

[Time_integration]
dt = 5
t_end = 10
time_integrator = tvdrk3
tolerance = 1e-12
starting_step = 0

[Spatial_discretization]
num_solpts = 3
num_elements_horizontal = 2
num_elements_vertical = 5

[Output_options]
stat_freq = 0
output_freq = 0
save_state_freq = 0
output_dir = results

[Device]
precision = double
pytorch_device = cpu
