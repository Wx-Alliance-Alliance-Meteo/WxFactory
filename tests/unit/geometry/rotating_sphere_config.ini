# Small rotating cubed-sphere Euler configuration for the metric identity tests.
#
# DCMIP 1-1 is used because it keeps the planet's true radius and rotation rate. The small-planet
# cases (2-1, 2-2, 3-1) set the rotation rate to zero, which would make the Coriolis identities
# vacuous. The grid is deliberately rotated away from the poles so that every panel carries a
# different centre latitude and rotation angle, and the Coriolis symbols differ from panel to
# panel.

[Grid]
grid_type = cubed_sphere
lambda0 = 0.6
phi0 = 0.4
alpha0 = 0.25

ztop = 12000.0

vertical_coord = sleve
sleve_scale_large = 10000.0
sleve_scale_small = 2500.0

[Test_case]
equations = euler
depth_approx = shallow
case_number = 11

[Time_integration]
t_end = 10
dt = 5
time_integrator = tvdrk3
tolerance = 1e-6

[Spatial_discretization]
num_solpts = 3
num_elements_horizontal = 2
num_elements_vertical = 3

[Output_options]
stat_freq = 0
output_freq = 0
base_output_file = metric_identities

[Device]
precision = double
pytorch_device = cpu
