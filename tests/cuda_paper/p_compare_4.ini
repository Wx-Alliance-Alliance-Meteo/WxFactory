[General]
equations = Euler
depth_approx = shallow

[System]
desired_device = cuda
; cuda_devices = [0, 1, 2]

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
#ϕ0 = 0.7853981633974483
alpha0 = 0.0

ztop = 10000.0

[Test_case]

case_number = 31

[Time_integration]

# Time step
dt = 1

# End time of the simulation in sec
#t_end = 0
t_end = 72
#t_end = 36000
#t_end = 450000

# Time integration scheme
time_integrator = epi2

# Solver tolerance
tolerance = 1e-7

verbose_solver = 1
gmres_restart = 200
exponential_solver = pmex


[Spatial_discretization]

# The grid will have (num_solpts) x (num_solpts) nodal points in each elements.
num_solpts = 4

# Number of element in x^1, x^2 and x^3 directions
num_elements_horizontal = 60  # 144, 288
num_elements_vertical = 15

[Output_options]

# Print blockstats every "stat_freq" steps, 0 to disable.
stat_freq = 1

# Plot solution every "output_freq" steps, 0 to disable.
output_freq = 0

# Save the state vector to a file at every "save_state_freq" steps. 0 to disable.
save_state_freq = 10

# Store statistics about the solver (iterations, residuals, etc.). 0 to disable.
store_solver_stats = 1

# Starting step (for restart from checkpoint)
starting_step = 0

output_dir = results_wx_paper
solver_stats_file = solver_stats.db
store_total_time = 1 
